# Copies Firebase's sign-in helper files onto this site, so
# https://snipesmcgeee.github.io/__/auth/handler exists on the same domain as the games.
# That lets Google sign-in work in browsers that block cross-site storage (e.g. iPhone Chrome).
# See pokeprof DESIGN.md "Save System & Cloud Save" -> Sign-in helper hosting.
#
# Run it: Actions tab -> "Fetch Firebase sign-in helper" -> Run workflow.
# It also re-fetches on the 1st of every month so the files never go stale.

name: Fetch Firebase sign-in helper

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'
  push:
    paths:
      - '.github/workflows/fetch-auth-helper.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download helper files from Firebase
        env:
          SRC: https://pokeprof-87205.firebaseapp.com
        run: |
          set -euo pipefail
          mkdir -p __/auth __/firebase
          # Extensionless HTML pages are saved as .html: GitHub Pages serves /__/auth/handler
          # from handler.html with the right content type (an extensionless file would download).
          # Required files: the job fails if any of these can't be fetched.
          get() { code=$(curl -sSL -w '%{http_code}' "$SRC/$1" -o "$2"); echo "$code $1"; [ "$code" = "200" ]; }
          get __/auth/handler        __/auth/handler.html
          get __/auth/handler.js     __/auth/handler.js
          get __/auth/experiments.js __/auth/experiments.js
          get __/auth/iframe         __/auth/iframe.html
          get __/auth/iframe.js      __/auth/iframe.js
          # Optional files (only served when Firebase Hosting is set up, or only used by
          # email-link sign-in): fetched if available, otherwise skipped / filled in below.
          get __/auth/links          __/auth/links.html || rm -f __/auth/links.html
          get __/auth/links.js       __/auth/links.js   || rm -f __/auth/links.js
          if ! get __/firebase/init.json __/firebase/init.json; then
            # This project has no Firebase Hosting site, so build init.json from the public web config.
            printf '%s\n' '{"apiKey":"AIzaSyDdN18QZddkf6CuxdGz_RU28OeyyPROcis","authDomain":"pokeprof-87205.firebaseapp.com","projectId":"pokeprof-87205","storageBucket":"pokeprof-87205.firebasestorage.app","messagingSenderId":"320248122173","appId":"1:320248122173:web:f17fcf8e6e6d867fd4d354"}' > __/firebase/init.json
            echo "init.json written from web config"
          fi
          ls -la __/auth __/firebase

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __
          if git diff --cached --quiet; then
            echo "Helper files unchanged."
          else
            git commit -m "Update Firebase sign-in helper files"
            git push
          fi
